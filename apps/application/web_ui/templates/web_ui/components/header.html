<header class="topbar">
  <a class="brand" href="/" aria-label="Micometeo"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6 8h-3l4 6H5l4-6H6z"/><path d="M12 17v4"/></svg><span class="brand-text"><span class="brand-name">Micometeo</span><span class="brand-line">{{ labels.tagline }}</span></span></a>
  <form class="search" role="search" data-search-form autocomplete="off"><div class="search-field"><svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg><label class="sr-only" for="search-input">{{ labels.search }}</label><input id="search-input" name="place" type="search" placeholder="{{ labels.search }}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" data-place-search></div><button class="btn btn-location" type="button" data-location><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="btn-text">{{ labels.location }}</span></button><div class="search-results" id="search-results" data-search-results role="listbox" aria-label="{{ labels.search_results }}"{% if fixture_state != 'no_results' %} hidden{% endif %}>{% if fixture_state == 'no_results' %}<div class="result-empty" data-state-message data-kind="no-results"><strong>{{ labels.no_results }}</strong></div>{% endif %}</div><div class="search-status sr-only" data-search-status role="status" aria-live="polite"></div></form>
  <div class="actions"><button class="btn btn-dark btn-fav" type="button" data-favourites aria-label="{{ labels.favorites }}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.2 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg><span class="btn-text">{{ labels.favorites }}</span><span class="count" data-favourite-count></span></button></div>
</header>
