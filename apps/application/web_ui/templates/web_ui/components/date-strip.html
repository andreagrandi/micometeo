<section class="datecol" id="datecol" aria-labelledby="dates-heading"><div class="date-head"><h2 id="dates-heading">{{ labels.select_date }}</h2><p class="date-assess">{{ labels.assessment }}: {{ assessment_date_display }}</p>{% if not details_open %}<p class="date-hint">{{ labels.date_hint }}</p>{% endif %}</div><ol class="dates" id="dates">{% for item in dates %}<li><button type="button" class="date-btn{% if forloop.counter0 == date_selected_index|default:0 %} is-selected{% endif %}" data-date="{{ item.iso }}" data-intl-date="{{ item.iso }}" aria-pressed="{% if forloop.counter0 == date_selected_index|default:0 %}true{% else %}false{% endif %}"><span class="d-wd">{{ item.weekday }}</span><span class="d-dm">{{ item.short }}</span><span class="d-pct">{% if item.estimate %}{{ item.estimate }}%{% endif %}</span></button></li>{% endfor %}</ol></section>
