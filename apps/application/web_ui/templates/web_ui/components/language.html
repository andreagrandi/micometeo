<div class="language-switch" role="group" aria-label="{{ labels.footer_language }}">
  <svg class="language-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
    <path d="M3 12h18M12 3c2.3 2.5 3.4 5.5 3.4 9S14.3 18.5 12 21M12 3c-2.3 2.5-3.4 5.5-3.4 9S9.7 18.5 12 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </svg>
  <button type="button" data-language="it" lang="it" class="{% if language == 'it' %}is-current{% endif %}">IT</button>
  <span aria-hidden="true">/</span>
  <button type="button" data-language="en" lang="en" class="{% if language == 'en' %}is-current{% endif %}">EN</button>
</div>
