{% load static %}
<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Micometeo">
    <title>{% block title %}Micometeo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block styles %}<link rel="stylesheet" href="{% static 'web_ui/app.css' %}">{% endblock %}
    {% block head %}{% endblock %}
  </head>
  <body class="{{ body_class|default:'' }}">
    {% block content %}{% endblock %}
    <script src="{% static 'web_ui/app.js' %}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
