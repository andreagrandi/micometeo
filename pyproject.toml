[project]
name = "micometeo"
version = "0.1.0"
description = "Epic 1 validation experiments for Micometeo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
micometeo = "micometeo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micometeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
