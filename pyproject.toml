[project]
name = "micometeo"
version = "0.1.0"
description = "Epic 1 validation experiments for Micometeo."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cdsapi>=0.7.7",
    "django>=5.2.6",
    "django-ninja>=1.4.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pyarrow>=26.0.0",
    "psycopg[binary]>=3.2.10",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
]

[project.scripts]
micometeo = "micometeo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-django>=4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micometeo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["src", "apps/api", "apps/application"]
