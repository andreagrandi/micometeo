description = "P3b: compare forecasts published in the past with the weather that fell, 1, 3 and 7 days ahead of each find."
seed = 42
time_limit_minutes = 30

[settings]
# Finds from the P1 run. Only rows with area home or comparison are in this file.
finds_path = "data/processed/p1_observations/20261010T181005Z-696b43/finds.parquet"
# Every home find (Tuscany) is used. This many comparison finds (Switzerland and Austria) are drawn with the seed.
comparison_sample = 64
# Days between the forecast and the day it is about.
days_ahead = [1, 3, 7]
# Window lengths in days.
windows = [7, 14, 30]
# The last this many days before the assessment date come from model values for past hours.
reconstructed_missing_days = 6
# Seconds to wait between two real requests, to stay far below 600 calls a minute.
pause_seconds = 0.2
# Hours after the start of a model run until its forecast is public. Open-Meteo says 4 to 6.
publication_delay_hours = 6
forecast_model = "ecmwf_ifs"
# Days a single run request asks for. The longest days_ahead needs 7.
forecast_days = 10
# Fixed point for the source survey, in the Pistoia sample area.
check_latitude = 44.05
check_longitude = 10.8
# Earliest day the survey looks at.
survey_start = "2016-01-01"
previous_runs_models = [
    "best_match",
    "ecmwf_ifs",
    "ecmwf_ifs025",
    "ecmwf_aifs025_single",
    "icon_seamless",
    "icon_eu",
    "gfs_seamless",
    "meteofrance_seamless",
    "italia_meteo_arpae_icon_2i",
    "ukmo_seamless",
]
single_runs_models = ["ecmwf_ifs", "ecmwf_ifs025", "icon_seamless", "gfs_seamless"]
historical_forecast_models = ["ecmwf_ifs", "icon_seamless", "gfs_seamless"]
# Folder for the small CSV files that people read.
reports_dir = "reports"
