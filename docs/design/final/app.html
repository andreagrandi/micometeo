<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SporaMeteo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#map" data-i18n="skip_to_map"></a>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6 8h-3l4 6H5l4-6H6z"/><path d="M12 17v4"/></svg>
      <div class="brand-text">
        <span class="brand-name">SporaMeteo</span>
        <span class="brand-line" data-i18n="tagline"></span>
      </div>
    </div>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <div class="search-field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg>
        <input id="search-input" type="text" enterkeyhint="search" data-i18n-aria="search" data-i18n-placeholder="search">
      </div>
      <button class="btn btn-secondary btn-location" id="location-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span class="btn-text" data-i18n="location"></span>
      </button>
      <div class="search-results" id="search-results" hidden></div>
    </form>
    <div class="actions">
      <button class="btn btn-dark btn-fav" id="fav-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.2 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
        <span class="btn-text" data-i18n="favorites"></span>
        <span class="count" id="fav-count"></span>
      </button>
    </div>
  </header>

  <div class="notice-sample sample-band" id="sample-notice"><strong data-i18n="design_label"></strong> <span data-i18n="design_text"></span></div>

  <main class="main" id="main">
    <div class="mapbottom">
      <section class="panel" id="legend-panel" aria-labelledby="legend-heading">
        <div class="panel-head">
          <h2 id="legend-heading"><span class="h-phone" data-i18n="legend_heading"></span><span class="h-desk" data-i18n="legend_scale_short"></span></h2>
          <button class="btn btn-quiet panel-close" type="button" data-close-panel="legend"><span data-i18n="close"></span></button>
          <button class="fold-btn" type="button" data-fold="legend" aria-expanded="true" aria-controls="legend-body"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        </div>
        <div id="legend-body"></div>
      </section>

      <section class="datecol" id="datecol" aria-labelledby="dates-heading">
        <div class="date-head">
          <h2 id="dates-heading" data-i18n="date_heading"></h2>
          <p class="date-assess" id="date-assess"></p>
          <p class="date-hint" id="date-hint" data-i18n="date_hint"></p>
        </div>
        <ol class="dates" id="dates"></ol>
      </section>
    </div>

    <div class="maptr">
      <section class="panel" id="layers-panel" aria-labelledby="layers-heading">
        <div class="panel-head">
          <h2 id="layers-heading" data-i18n="layers_heading"></h2>
          <button class="btn btn-quiet panel-close" type="button" data-close-panel="layers"><span data-i18n="close"></span></button>
          <button class="fold-btn" type="button" data-fold="layers" aria-expanded="true" aria-controls="layers-body"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        </div>
        <div id="layers-body">
        <fieldset class="bg-choice">
          <legend data-i18n="background"></legend>
          <label class="choice"><input type="radio" name="background" value="light" checked><span data-i18n="bg_light"></span></label>
          <label class="choice"><input type="radio" name="background" value="contrast"><span data-i18n="bg_contrast"></span></label>
        </fieldset>
        <div class="switch-row">
          <span id="overlay-label" data-i18n="overlay"></span>
          <button class="switch" id="overlay-toggle" type="button" role="switch" aria-checked="true" aria-labelledby="overlay-label"><span></span></button>
        </div>
        <div class="slider-row">
          <label for="opacity" data-i18n="opacity"></label>
          <div class="slider-line">
            <input id="opacity" type="range" min="0" max="100" step="5" value="60">
            <output id="opacity-value" for="opacity">60%</output>
          </div>
        </div>
        </div>
      </section>

      <div class="zoombox">
        <button class="btn-zoom" id="zoom-in" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="btn-zoom" id="zoom-out" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="mapcell">
      <div id="map" tabindex="0" role="region" data-i18n-aria="map_label"></div>
      <div class="progress" id="progress" hidden><span></span></div>
      <div class="maptop">
        <div class="mapmsgs" id="mapmsgs" aria-live="polite"></div>
        <button class="btn btn-secondary map-centre" id="centre-btn" type="button" hidden><span data-i18n="select_centre"></span></button>
      </div>
    </div>

    <footer class="mapfoot">
      <div class="lang" role="group" data-i18n-aria="language">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <button type="button" data-lang="it" lang="it" aria-label="Italiano">IT</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      </div>
      <p class="attribution" data-i18n-html="attribution"></p>
    </footer>

    <div class="sheetwrap" id="sheetwrap">
      <div class="floatbtns">
        <button class="btn btn-float" id="layers-btn" type="button" aria-expanded="false" aria-controls="layers-panel">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
          <span data-i18n="layers_button"></span>
        </button>
        <button class="btn btn-float" id="legend-btn" type="button" aria-expanded="false" aria-controls="legend-panel">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h1M3 12h1M3 18h1"/></svg>
          <span data-i18n="legend_button"></span>
        </button>
      </div>
      <aside class="details" id="details" data-size="short" hidden></aside>
    </div>
  </main>
</div>

<div class="sr-only" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="modal drawer" id="fav-dialog" aria-labelledby="fav-heading"></dialog>
<dialog class="modal" id="save-dialog" aria-labelledby="save-heading"></dialog>
<dialog class="modal" id="nav-dialog" aria-labelledby="nav-heading"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="assets/sample_squares.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
