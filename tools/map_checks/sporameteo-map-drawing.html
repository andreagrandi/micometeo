<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SporaMeteo map drawing measurement</title>
<link rel="stylesheet" href="/maplibre-gl.css">
<style>html,body,#map{margin:0;width:100%;height:100%;}</style>
<div id="map"></div>
<script type="module">
  import * as maplibregl from "/maplibre-gl.mjs";
  window.maplibregl = maplibregl;
</script>
<script>
window.runMeasurement = async function (name) {
  const start = performance.now();
  const response = await fetch(`/sporameteo-map-${name}.geojson`);
  const data = await response.json();
  const loaded = performance.now();
  const coordinates = data.features.flatMap(feature => feature.geometry.coordinates[0]);
  const bounds = coordinates.reduce((box, point) => box.extend(point), new maplibregl.LngLatBounds());
  const map = new maplibregl.Map({
    container: "map",
    attributionControl: false,
    style: {version: 8, sources: {}, layers: [
      {id: "background", type: "background", paint: {"background-color": "#f3f1e8"}}
    ]},
    bounds,
    fitBoundsOptions: {padding: 10, duration: 0},
    fadeDuration: 0
  });
  await new Promise(resolve => map.once("load", resolve));
  const drawStart = performance.now();
  map.addSource("squares", {type: "geojson", data});
  map.addLayer({id: "squares", type: "fill", source: "squares", paint: {
    "fill-color": ["case", ["==", ["get", "state"], "noforest"], "#ded8c4",
      ["interpolate", ["linear"], ["coalesce", ["get", "percentage"], 0], 0, "#eff3db", 100, "#205d35"]],
    "fill-opacity": 0.8
  }});
  await new Promise(resolve => map.once("idle", resolve));
  const done = performance.now();
  const rendered = map.queryRenderedFeatures({layers: ["squares"]}).length;
  const result = {
    name,
    squares: data.features.length,
    rendered_features: rendered,
    local_fetch_and_json_ms: loaded - start,
    source_to_idle_ms: done - drawStart,
    total_ms: done - start,
    maplibre_version: maplibregl.getVersion(),
    viewport: {width: innerWidth, height: innerHeight, device_pixel_ratio: devicePixelRatio}
  };
  map.remove();
  return result;
};
</script>
